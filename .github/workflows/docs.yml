# .github/workflows/docs.yml
name: Build Docs

on:
  pull_request:
    branches:
      - master
    paths:
      - 'man/**'
      - '**.md'

jobs:
  build-docs:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            make \
            pandoc \
            python3-pip \
            texinfo \
            texlive-plain-generic
          pip3 install md-toc --break-system-packages

      - name: Build docs
        run: |
          make doc-regenerate

      - name: Upload generated docs
        uses: actions/upload-artifact@v6
        with:
          name: hyperbole-docs
          path: |
            man/hyperbole.info
            man/hyperbole.pdf
            man/hyperbole.html
            README.md.html
          if-no-files-found: error
          retention-days: 14
